<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Rahmengestell 3D – Bayram Usta</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
                body, html { width: 100%; height: 100%; overflow: hidden; background-color: #121214; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #f0f0f2; }
                    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
                        .bottom-bar {
                              position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
                                    display: flex; gap: 8px; background: rgba(24, 24, 28, 0.85); backdrop-filter: blur(16px);
                                          padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12);
                                                box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10;
                                                    }
                                                        .btn {
                                                              background: rgba(255, 255, 255, 0.08); border: none; color: #fff; padding: 8px 14px;
                                                                    border-radius: 999px; font-size: 13px; font-weight: 500; display: inline-flex;
                                                                          align-items: center; gap: 6px; cursor: pointer; transition: background 0.2s;
                                                                              }
                                                                                  .btn:active { background: rgba(255, 255, 255, 0.2); }
                                                                                      .btn.active { background: #d97706; color: #fff; }
                                                                                          .drawer {
                                                                                                position: absolute; bottom: 0; left: 0; width: 100%; max-height: 80vh;
                                                                                                      background: #18181c; border-top: 1px solid rgba(255,255,255,0.15);
                                                                                                            border-radius: 20px 20px 0 0; padding: 20px; z-index: 20;
                                                                                                                  transform: translateY(105%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
                                                                                                                        overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
                                                                                                                            }
                                                                                                                                .drawer.open { transform: translateY(0); }
                                                                                                                                    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
                                                                                                                                        .drawer-title { font-size: 17px; font-weight: 600; }
                                                                                                                                            .close-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
                                                                                                                                                .view-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
                                                                                                                                                    .view-btn { background: #242429; border: 1px solid rgba(255,255,255,0.08); color: #fff; padding: 10px; border-radius: 10px; font-size: 13px; cursor: pointer; }
                                                                                                                                                        .slider-row { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
                                                                                                                                                            .slider-row input[type="range"] { width: 100%; accent-color: #d97706; }
                                                                                                                                                                .spec-table { width: 100%; border-collapse: collapse; font-size: 13px; }
                                                                                                                                                                    .spec-table th, .spec-table td { text-align: left; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); }
                                                                                                                                                                        .spec-table th { color: #a1a1aa; font-weight: 500; }
                                                                                                                                                                          </style>
                                                                                                                                                                            <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
                                                                                                                                                                              <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
                                                                                                                                                                              </head>
                                                                                                                                                                              <body>
                                                                                                                                                                                <div id="canvas-container"></div>

                                                                                                                                                                                  <div class="bottom-bar">
                                                                                                                                                                                      <button class="btn" id="btn-controls">Steuerung</button>
                                                                                                                                                                                          <button class="btn" id="btn-specs">Zuschnitt</button>
                                                                                                                                                                                              <button class="btn" id="btn-reset">Reset</button>
                                                                                                                                                                                                </div>

                                                                                                                                                                                                  <div class="drawer" id="controls-drawer">
                                                                                                                                                                                                      <div class="drawer-header">
                                                                                                                                                                                                            <span class="drawer-title">Modellsteuerung</span>
                                                                                                                                                                                                                  <button class="close-btn" onclick="closeDrawers()">✕</button>
                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                          <div class="view-grid">
                                                                                                                                                                                                                                <button class="view-btn" onclick="setView('front')">Vorne</button>
                                                                                                                                                                                                                                      <button class="view-btn" onclick="setView('side')">Seite (Trapez)</button>
                                                                                                                                                                                                                                            <button class="view-btn" onclick="setView('top')">Draufsicht</button>
                                                                                                                                                                                                                                                  <button class="view-btn" onclick="setView('iso')">3D Perspektive</button>
                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                          <div class="slider-row">
                                                                                                                                                                                                                                                                <label>Explosionsansicht: <span id="explode-val">0%</span></label>
                                                                                                                                                                                                                                                                      <input type="range" id="explode-slider" min="0" max="100" value="0">
                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                              <div class="drawer" id="specs-drawer">
                                                                                                                                                                                                                                                                                  <div class="drawer-header">
                                                                                                                                                                                                                                                                                        <span class="drawer-title">Zuschnittliste (Bayram Usta)</span>
                                                                                                                                                                                                                                                                                              <button class="close-btn" onclick="closeDrawers()">✕</button>
                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                      <table class="spec-table">
                                                                                                                                                                                                                                                                                                            <tr><th>Bauteil</th><th>Maße (B × T × D)</th><th>Details</th></tr>
                                                                                                                                                                                                                                                                                                                  <tr><td>Boden</td><td>60 × 30 × 2 cm</td><td>Rechteckig</td></tr>
                                                                                                                                                                                                                                                                                                                        <tr><td>Dach</td><td>60 × 10/15 × 2 cm</td><td>Mitte +5 cm gewölbt</td></tr>
                                                                                                                                                                                                                                                                                                                              <tr><td>Seitenwand (2x)</td><td>83 cm hoch, 2 cm dick</td><td>Trapez (unten 30, oben 10 cm)</td></tr>
                                                                                                                                                                                                                                                                                                                                  </table>
                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                      <script>
                                                                                                                                                                                                                                                                                                                                          const container = document.getElementById('canvas-container');
                                                                                                                                                                                                                                                                                                                                              const scene = new THREE.Scene();
                                                                                                                                                                                                                                                                                                                                                  scene.background = new THREE.Color(0x161619);

                                                                                                                                                                                                                                                                                                                                                      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                                                                                                                                                                                                                                                                                                                                                          camera.position.set(90, 70, 110);

                                                                                                                                                                                                                                                                                                                                                              const renderer = new THREE.WebGLRenderer({ antialias: true });
                                                                                                                                                                                                                                                                                                                                                                  renderer.setSize(window.innerWidth, window.innerHeight);
                                                                                                                                                                                                                                                                                                                                                                      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                                                                                                                                                                                                                                                                                                                                                                          renderer.shadowMap.enabled = true;
                                                                                                                                                                                                                                                                                                                                                                              container.appendChild(renderer.domElement);

                                                                                                                                                                                                                                                                                                                                                                                  const controls = new THREE.OrbitControls(camera, renderer.domElement);
                                                                                                                                                                                                                                                                                                                                                                                      controls.enableDamping = true;
                                                                                                                                                                                                                                                                                                                                                                                          controls.autoRotate = false;
                                                                                                                                                                                                                                                                                                                                                                                              controls.target.set(0, 41.5, 0);

                                                                                                                                                                                                                                                                                                                                                                                                  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
                                                                                                                                                                                                                                                                                                                                                                                                      const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
                                                                                                                                                                                                                                                                                                                                                                                                          dirLight.position.set(60, 120, 80);
                                                                                                                                                                                                                                                                                                                                                                                                              scene.add(dirLight);

                                                                                                                                                                                                                                                                                                                                                                                                                  const grid = new THREE.GridHelper(160, 32, 0xd97706, 0x2e2e34);
                                                                                                                                                                                                                                                                                                                                                                                                                      grid.position.y = -0.5;
                                                                                                                                                                                                                                                                                                                                                                                                                          scene.add(grid);

                                                                                                                                                                                                                                                                                                                                                                                                                              const woodMat = new THREE.MeshStandardMaterial({ color: 0x824922, roughness: 0.6, metalness: 0.1 });

                                                                                                                                                                                                                                                                                                                                                                                                                                  const bottom = new THREE.Mesh(new THREE.BoxGeometry(60, 2, 30), woodMat);
                                                                                                                                                                                                                                                                                                                                                                                                                                      bottom.position.set(0, 1, 15);
                                                                                                                                                                                                                                                                                                                                                                                                                                          scene.add(bottom);

                                                                                                                                                                                                                                                                                                                                                                                                                                              const topShape = new THREE.Shape();
                                                                                                                                                                                                                                                                                                                                                                                                                                                  topShape.moveTo(-30, 0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                      topShape.lineTo(30, 0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                          topShape.lineTo(30, 10);
                                                                                                                                                                                                                                                                                                                                                                                                                                                              topShape.lineTo(10, 10);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  topShape.bezierCurveTo(5, 15, -5, 15, -10, 10);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      topShape.lineTo(-30, 10);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          topShape.closePath();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const topGeom = new THREE.ExtrudeGeometry(topShape, { depth: 2, bevelEnabled: false });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  topGeom.rotateX(-Math.PI / 2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const topMesh = new THREE.Mesh(topGeom, woodMat);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          topMesh.position.set(0, 84, 0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              scene.add(topMesh);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function createSide(isLeft) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const shape = new THREE.Shape();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              shape.moveTo(0, 0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    shape.lineTo(0, 83);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          shape.lineTo(10, 83);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                shape.lineTo(30, 0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      shape.closePath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const geom = new THREE.ExtrudeGeometry(shape, { depth: 2, bevelEnabled: false });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const mesh = new THREE.Mesh(geom, woodMat);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        mesh.rotation.y = -Math.PI / 2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              mesh.position.set(isLeft ? -28 : 30, 1, 0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return mesh;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const sideL = createSide(true);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const sideR = createSide(false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    scene.add(sideL);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        scene.add(sideR);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function updateExplode(factor) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  bottom.position.y = 1 - factor * 20;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        topMesh.position.y = 84 + factor * 20;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              sideL.position.x = -28 - factor * 25;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    sideR.position.x = 30 + factor * 25;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('explode-slider').addEventListener('input', (e) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const val = parseFloat(e.target.value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('explode-val').textContent = val + '%';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              updateExplode(val / 100);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      window.setView = function(type) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (type === 'front') { camera.position.set(0, 41.5, 130); controls.target.set(0, 41.5, 0); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  else if (type === 'side') { camera.position.set(130, 41.5, 15); controls.target.set(0, 41.5, 15); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        else if (type === 'top') { camera.position.set(0, 140, 15); controls.target.set(0, 0, 15); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              else if (type === 'iso') { camera.position.set(90, 70, 110); controls.target.set(0, 41.5, 0); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    controls.update();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          closeDrawers();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  window.closeDrawers = function() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('controls-drawer').classList.remove('open');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('specs-drawer').classList.remove('open');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById('btn-controls').onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('specs-drawer').classList.remove('open');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('controls-drawer').classList.toggle('open');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById('btn-specs').onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('controls-drawer').classList.remove('open');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById('specs-drawer').classList.toggle('open');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('btn-reset').onclick = () => setView('iso');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  window.addEventListener('resize', () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        camera.aspect = window.innerWidth / window.innerHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              camera.updateProjectionMatrix();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    renderer.setSize(window.innerWidth, window.innerHeight);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function animate() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  requestAnimationFrame(animate);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        controls.update();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              renderer.render(scene, camera);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      animate();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
